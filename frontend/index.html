<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>商城</title>
    <script>
      (() => {
        try {
          const brand = JSON.parse(localStorage.getItem("ka.site.branding") || "null");
          const title = brand && (brand.seoTitle || brand.siteName);
          if (typeof title === "string" && title.trim()) document.title = title;
          const icon = brand && brand.icon;
          if (typeof icon === "string" && icon.startsWith("/files/") && icon.indexOf("..") === -1 && icon.length <= 200) {
            document.querySelectorAll("link[data-ka-icon]").forEach((node) => {
              node.setAttribute("href", icon);
              node.removeAttribute("type");
            });
          }
        } catch (_) { /* Invalid or unavailable cache: keep the neutral title. */ }
        try {
          const root = document.documentElement;
          const theme = localStorage.getItem("ka.site.theme") || "gptibo";
          const siteMode = localStorage.getItem("ka.site.mode") || "auto";
          const localMode = localStorage.getItem("ka.mode");
          const dark = localMode === "dark" || (localMode !== "light" && (siteMode === "dark" || (siteMode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches)));
          root.dataset.theme = theme;
          root.dataset.mode = dark ? "dark" : "light";
          root.style.colorScheme = root.dataset.mode;
        } catch (_) { /* localStorage may be unavailable in privacy mode */ }
      })();
    </script>
    <meta name="theme-color" content="#fafafa" />
    <meta name="description" content="自动发卡 · 极速到账" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" data-ka-icon="svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" data-ka-icon="ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" data-ka-icon="apple" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
