# 测试环境:H2 内存库(MySQL 兼容模式),不依赖外部 MySQL;链扫描因商户地址为空自动跳过。
spring:
  datasource:
    url: jdbc:h2:mem:ka;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=VALUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: ka
  flyway:
    enabled: false # 普通 H2 业务测试;迁移另有独立测试
  jpa:
    hibernate:
      ddl-auto: create-drop

# 测试的 application.yml 会盖住 main 里的同名文件,这里要自己带上指标暴露,否则 /actuator/prometheus 不会注册。
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
      status:
        order:
          - DOWN
          - OUT_OF_SERVICE
          - DEGRADED
          - UNKNOWN
          - UP
        http-mapping:
          DEGRADED: 200
  health:
    mail:
      enabled: false

ka:
  security:
    jwt-secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQtMzJieXRlcy1taW5pbXVtISE=
    aes-key: dGVzdC1vbmx5LWFlcy0yNTYta2V5LTMyLWJ5dGVzISE=
  crypto:
    merchant-address: ""
    chains: []
