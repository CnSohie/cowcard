# 测试环境:H2 内存库(MySQL 兼容模式),不依赖外部 MySQL;链扫描因商户地址为空自动跳过。
spring:
  datasource:
    url: jdbc:h2:mem:ka;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=VALUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false # 普通 H2 业务测试;迁移另有独立测试
  jpa:
    hibernate:
      ddl-auto: create-drop

ka:
  security:
    jwt-secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQtMzJieXRlcy1taW5pbXVtISE=
    aes-key: dGVzdC1vbmx5LWFlcy0yNTYta2V5LTMyLWJ5dGVzISE=
  crypto:
    merchant-address: ""
    chains: []
